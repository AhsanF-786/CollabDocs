services:
  - type: web
    name: collabdocs-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: collabdocs-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        sync: false

databases:
  - name: collabdocs-db
    plan: free
    databaseName: collabdocs
    user: collabdocs
